name: astrbot_plugin_bilicard
display_name: BiliCard - B站/抖音视频卡片
desc: 自动识别群聊中的 B站视频链接、BV号、b23 短链与抖音口令/短链，渲染成信息卡片（B站含封面、UP主、播放/弹幕/点赞等统计、实时在线人数、热门评论、AI视频总结；抖音为封面+时长+点赞）并附上原视频链接；出图失败自动降级发链接；可选下载视频并以视频消息或文件形式发送。
short_desc: 群里发 B站/抖音视频自动出卡片，支持订阅 UP主新投稿推送与视频下载发送。
version: v0.6.0
author: AMag1c
repo: https://github.com/AMag1c/astrbot_plugin_bilicard
# 主要适配 QQ(aiocqhttp)：小程序卡片解析为其特有；链接/BV 解析、订阅推送在其它平台同样可用
support_platforms:
  - aiocqhttp
